services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: vtc
      POSTGRES_PASSWORD: vtc
      POSTGRES_DB: vtc
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vtc"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6380:6379"]
    volumes: [redisdata:/data]
volumes:
  pgdata:
  redisdata:
